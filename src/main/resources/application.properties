spring.application.name=api-autenticacao

# H2 em memória (some ao reiniciar); troque por Postgres para persistir
spring.datasource.url=jdbc:h2:mem:autenticacao;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# loga o SQL para acompanhar as consultas
spring.jpa.show-sql=true

# console do H2 em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# segredo HMAC usado para assinar os tokens (>= 32 bytes).
# Em produção: variável de ambiente / secret manager, nunca no repositório.
app.seguranca.jwt.secret=chave-de-estudo-super-secreta-com-pelo-menos-32-bytes
app.seguranca.jwt.expiracao-minutos=120
